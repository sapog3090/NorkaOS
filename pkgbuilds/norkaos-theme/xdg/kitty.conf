# Цвета kitty в NorkaOS: фон и текст из схемы NorkaOS, акценты фиолетовые.
# Свой ~/.config/kitty/kitty.conf у пользователя заменяет этот файл целиком
background #120b1f
foreground #ece6f7
selection_background #7a4fd0
selection_foreground #ffffff
cursor #b794f4
cursor_text_color #120b1f
url_color #c9b8ea
background_opacity 0.96
window_padding_width 6

# Чёрный, красный, зелёный, жёлтый, синий, пурпурный, голубой, белый; вторая восьмёрка ярче
color0  #241739
color8  #4a3470
color1  #f06c8b
color9  #ff8fa8
color2  #8fd9a8
color10 #b0f0c4
color3  #f2c97d
color11 #ffdfa0
color4  #8aa4f8
color12 #adc1ff
color5  #b794f4
color13 #d4bcff
color6  #7fd4e0
color14 #a6eaf2
color7  #c9b8ea
color15 #ffffff
