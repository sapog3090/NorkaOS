    # $prefix здесь указывает на диск внутри загрузчика, а тема лежит на самом ISO: это $root
    insmod gfxterm
    insmod png
    terminal_output gfxterm
    loadfont "($root)/boot/grub/themes/norkaos/norka-18.pf2"
    loadfont "($root)/boot/grub/themes/norkaos/norka-24.pf2"
    loadfont "($root)/boot/grub/themes/norkaos/norka-bold-24.pf2"
    set theme="($root)/boot/grub/themes/norkaos/theme.txt"
