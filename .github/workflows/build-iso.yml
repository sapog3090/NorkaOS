name: Сборка ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Поставить archiso
        run: pacman -Syu --noconfirm archiso grub noto-fonts

      - name: Доверять ключу NorkaOS
        run: |
          pacman-key --init
          pacman-key --add pkgbuilds/norkaos-keyring/norkaos.gpg
          pacman-key --lsign-key "$(cut -d: -f1 pkgbuilds/norkaos-keyring/norkaos-trusted)"

      - name: Собрать образ
        run: |
          bash archiso/make-profile.sh profile
          mkarchiso -v -w work -o out profile

      - name: Посчитать SHA-256
        run: cd out && sha256sum *.iso > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: out/*
          compression-level: 0
          retention-days: 7
